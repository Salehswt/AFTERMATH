id: scenario_07_web_sqli
name: "SQL injection data theft (DVWA)"
difficulty: medium
requires: linux
backstory: >
  The DVWA app behind the WAF (host :8081) took a run of requests carrying SQL
  in the query string from one source — boolean, UNION and time-based payloads
  against the same parameter. Reconstruct who, which parameter, and whether the
  WAF held.
seed_time_offset: "-8d"
chain:
  - technique: T1595.002
    action: web_scan
    test: 1
    note: "light probing of the edge first"
  - technique: T1190
    action: web_sqli
    test: 1
    note: "OR / UNION / blind SQLi against /vulnerabilities/sqli"
expected_detections:
  - source: modsecurity
    event_id: alert
    index: "lab-edge-modsecurity-*"
    description: "the WAF flagged SQL injection on the sqli endpoint"
    query: 'source.ip:"172.30.0.100" AND url.original:*sqli*'
  - source: modsecurity
    event_id: alert
    index: "lab-edge-modsecurity-*"
    description: "any WAF block from the attacker IP"
    query: 'event.module:"modsecurity" AND source.ip:"172.30.0.100"'
iocs:
  - { type: ip,  value: "172.30.0.100" }
  - { type: url, value: "/vulnerabilities/sqli/?id=1' UNION SELECT user,password FROM users" }
answer_summary: >
  A single source (172.30.0.100) attacked the DVWA "id" parameter with boolean
  (' OR '1'='1), UNION (SELECT user,password FROM users) and time-based
  (' AND SLEEP(5)) SQL injection (T1190). ModSecurity flagged and blocked each,
  recording the payloads to lab-edge-modsecurity-* with the real client IP from
  X-Forwarded-For. Confirm the WAF blocked (403) rather than the app returning
  data, then pivot on the source IP.
