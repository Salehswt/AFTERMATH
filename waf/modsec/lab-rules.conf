# Lab-local ModSecurity tweaks layered on top of OWASP CRS.
# Detection-mode friendly: log everything, block the obvious.
SecRuleEngine On
SecAuditEngine RelevantOnly
SecAuditLog /var/log/modsec/audit.log
SecAuditLogFormat JSON
SecAuditLogParts ABIJDEFHKZ

# Custom marker rule so analysts can find WAF hits easily in Kibana.
SecRule REQUEST_URI "@rx (?:union.*select|<script>|\.\./|/etc/passwd)" \
  "id:900100,phase:2,deny,status:403,log,msg:'LAB: obvious web attack pattern',tag:'lab'"
