# Reverse proxy: two web apps, each through its own WAF, each at the root of its
# own port so absolute links in the app don't break.
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log /var/log/nginx/access.log;

  # The owasp/modsecurity-crs:nginx image listens on 8080 (rootless), not 80.
  upstream waf_backend      { server waf:8080; }
  upstream waf_dvwa_backend { server waf-dvwa:8080; }

  # :80  -> WAF -> Juice Shop
  server {
    listen 80;
    server_name _;
    location / {
      proxy_pass http://waf_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # :81  -> WAF -> DVWA
  server {
    listen 81;
    server_name _;
    location / {
      proxy_pass http://waf_dvwa_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
