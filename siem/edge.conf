# Logstash pipeline — ships edge telemetry into Elasticsearch.
# Inputs: Suricata eve.json (network) + ModSecurity audit log (WAF).
# Normalizes both toward ECS-ish field names so they sit alongside the
# Windows/agent data in Kibana.

input {
  # ---- Suricata (edge sensor): proxy/WAF traffic ----
  file {
    path => "/logs/suricata/eve.json"
    codec => json
    sincedb_path => "/dev/null"           # lab: always read from start on boot
    tags => ["suricata", "sensor_edge"]
  }
  # ---- Suricata (victim sensor): attacker -> victim traffic ----
  # Only produces data when the linux-victim overlay is running.
  file {
    path => "/logs/suricata-victim/eve.json"
    codec => json
    sincedb_path => "/dev/null"
    tags => ["suricata", "sensor_victim"]
  }
  # ---- ModSecurity: JSON audit logs (both WAFs write here) ----
  file {
    path => "/logs/modsec/*.log"
    codec => json
    sincedb_path => "/dev/null"
    tags => ["modsec"]
  }
}

filter {
  # ---- Suricata normalization ----
  if "suricata" in [tags] {
    date { match => ["timestamp", "ISO8601"] }

    # Which sensor saw it — lets an analyst tell "at the edge" from "at the host".
    if "sensor_victim" in [tags] {
      mutate { add_field => { "[observer][name]" => "suricata-victim" } }
    } else {
      mutate { add_field => { "[observer][name]" => "suricata-edge" } }
    }

    mutate {
      add_field => {
        "[event][module]"  => "suricata"
        "[event][kind]"    => "event"
        "[source][ip]"     => "%{[src_ip]}"
        "[destination][ip]"=> "%{[dest_ip]}"
      }
    }

    # Alerts are the high-value events — flag them for easy filtering.
    if [event_type] == "alert" {
      mutate {
        add_field => {
          "[event][kind]"        => "alert"
          "[rule][name]"         => "%{[alert][signature]}"
          "[rule][category]"     => "%{[alert][category]}"
          "[event][severity]"    => "%{[alert][severity]}"
        }
      }
    }

    # TLS JA3 → keep the fingerprint discoverable for C2 hunting.
    if [tls][ja3][hash] {
      mutate { add_field => { "[tls][ja3][hash]" => "%{[tls][ja3][hash]}" } }
    }
  }

  # ---- ModSecurity normalization ----
  if "modsec" in [tags] {
    date { match => ["[transaction][time_stamp]", "ISO8601", "dd/MMM/yyyy:HH:mm:ss Z"] }
    mutate {
      add_field => {
        "[event][module]"  => "modsecurity"
        "[event][kind]"    => "alert"
        "[url][original]"  => "%{[transaction][request][uri]}"
        "[http][request][method]" => "%{[transaction][request][method]}"
      }
    }
    # The WAF's direct client is the proxy, so the real attacker IP is in
    # X-Forwarded-For. Prefer the first IP there; fall back to client_ip.
    if [transaction][request][headers][X-Forwarded-For] {
      grok { match => { "[transaction][request][headers][X-Forwarded-For]" => "^%{IP:[source][ip]}" }
             tag_on_failure => ["_xff_grokfail"] }
    }
    if ![source][ip] {
      mutate { add_field => { "[source][ip]" => "%{[transaction][client_ip]}" } }
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    # Route by source so Kibana index patterns stay clean.
    index    => "lab-edge-%{[event][module]}-%{+YYYY.MM.dd}"
  }
}
